name: Unity tests

# Runs on GitHub's free Linux machines in GameCI's Unity containers, on pushes to master and by hand, never on pull
# requests: the Unity license lives in the repository's secrets, which a fork's pull request never receives.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: unity-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  editmode:
    name: EditMode tests
    if: github.repository == 'pndte/match-please'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Make room for the Unity image
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          large-packages: false
          swap-storage: false

      - name: Check out
        uses: actions/checkout@v4

      - name: Restore the imported Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-EditMode-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-EditMode-
            Library-

      # @v4 is v4.4.0, a wrapper of game-ci/cli that exits with 1 before Docker starts; v4.3.2 runs the container itself.
      - name: Run the EditMode tests
        id: tests
        uses: game-ci/unity-test-runner@v4.3.2
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          testMode: editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: EditMode test results

      - name: Summarize the results
        if: always()
        shell: python3 {0}
        env:
          RESULTS: ${{ steps.tests.outputs.artifactsPath || 'artifacts' }}/editmode-results.xml
        run: |
          import os
          import xml.etree.ElementTree as ElementTree

          lines = ["### EditMode tests", ""]
          if os.path.exists(os.environ["RESULTS"]):
              run = ElementTree.parse(os.environ["RESULTS"]).getroot()
              seconds = float(run.get("duration", "0").replace(",", "."))
              lines += [
                  "| Total | Passed | Failed | Skipped | Seconds |",
                  "|---|---|---|---|---|",
                  f"| {run.get('total')} | {run.get('passed')} | {run.get('failed')} | {run.get('skipped')} | {seconds:.1f} |",
              ]
              failed = run.findall(".//test-case[@result='Failed']")
              if failed:
                  lines += ["", "#### Failed"]
                  for case in failed:
                      message = " ".join((case.findtext("failure/message") or "no message").split())
                      lines.append(f"- `{case.get('fullname')}`: {message}")
          else:
              lines.append("Unity wrote no test results: see the log of the test step.")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\n".join(lines) + "\n")

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editmode-results
          path: ${{ steps.tests.outputs.artifactsPath || 'artifacts' }}
          if-no-files-found: warn
          retention-days: 14
