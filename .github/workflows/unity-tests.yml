name: Unity tests

# Runs on the project's own Linux machine (a self-hosted runner labelled "unity") in GameCI's Unity containers,
# never on pull requests: a public repository must not let a fork's code run on that machine.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: unity-tests
  cancel-in-progress: false

jobs:
  editmode:
    name: EditMode tests
    if: github.repository == 'pndte/match-please'
    runs-on: [self-hosted, linux, unity]
    timeout-minutes: 120
    steps:
      - name: Check out, keeping the imported Library
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Forget the previous results
        run: rm -rf artifacts

      - name: Run the EditMode tests
        id: tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          testMode: editmode
          coverageEnabled: false
          runAsHostUser: true
          checkName: EditMode test results

      - name: Summarize the results
        if: always()
        shell: python3 {0}
        env:
          RESULTS: ${{ steps.tests.outputs.artifactsPath || 'artifacts' }}/editmode-results.xml
        run: |
          import os
          import xml.etree.ElementTree as ElementTree

          lines = ["### EditMode tests", ""]
          if os.path.exists(os.environ["RESULTS"]):
              run = ElementTree.parse(os.environ["RESULTS"]).getroot()
              seconds = float(run.get("duration", "0").replace(",", "."))
              lines += [
                  "| Total | Passed | Failed | Skipped | Seconds |",
                  "|---|---|---|---|---|",
                  f"| {run.get('total')} | {run.get('passed')} | {run.get('failed')} | {run.get('skipped')} | {seconds:.1f} |",
              ]
              failed = run.findall(".//test-case[@result='Failed']")
              if failed:
                  lines += ["", "#### Failed"]
                  for case in failed:
                      message = " ".join((case.findtext("failure/message") or "no message").split())
                      lines.append(f"- `{case.get('fullname')}`: {message}")
          else:
              lines.append("Unity wrote no test results: see the log of the test step.")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\n".join(lines) + "\n")

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editmode-results
          path: ${{ steps.tests.outputs.artifactsPath || 'artifacts' }}
          if-no-files-found: warn
          retention-days: 14
